<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Kinetic — Concept A "Tamed curve": an acceleration curve settling into a straight line. -->
  <defs>
    <clipPath id="squircle"><path d="M512 0C120 0 0 120 0 512s120 512 512 512 512-120 512-512S904 0 512 0z"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f2e"/><stop offset="1" stop-color="#090b12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.55"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5b4fc"/><stop offset="0.5" stop-color="#60a5fa"/><stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.04"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <!-- faint grid: the "settings" undertone -->
    <g stroke="#ffffff" stroke-opacity="0.045" stroke-width="2">
      <path d="M0 256H1024M0 512H1024M0 768H1024M256 0V1024M512 0V1024M768 0V1024"/>
    </g>
    <!-- blurred underglow of the ribbon -->
    <path d="M150 760 C 300 760, 330 300, 512 300 S 724 480, 880 290" fill="none" stroke="#60a5fa" stroke-width="120" stroke-linecap="round" filter="url(#blur)" opacity="0.7"/>
    <!-- the ribbon: wild curve on the left settling into a clean line on the right -->
    <path d="M150 760 C 300 760, 330 300, 512 300 S 724 480, 880 290" fill="none" stroke="url(#ribbon)" stroke-width="84" stroke-linecap="round" filter="url(#shadow)"/>
    <!-- top gloss on the ribbon -->
    <path d="M150 760 C 300 760, 330 300, 512 300 S 724 480, 880 290" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="18" stroke-linecap="round" transform="translate(0,-22)"/>
    <!-- end dot: the pointer, landed exactly where intended -->
    <circle cx="880" cy="290" r="62" fill="#e0f2fe" filter="url(#soft)" opacity="0.9"/>
    <circle cx="880" cy="290" r="46" fill="#fff"/>
    <!-- glass sheen -->
    <rect width="1024" height="1024" fill="url(#gloss)"/>
  </g>
</svg>
