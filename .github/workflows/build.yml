# Every push to main is tested and built. A release tag also signs, notarizes and publishes the
# DMG through Debut; Scripts/release.sh creates those tags.
name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*", "alpha-*", "beta-*"]
  workflow_dispatch:

permissions:
  contents: write # publishing the release

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      - name: Run tests
        run: swift test

      - name: Build
        run: ./build.sh release

      - name: Read the version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: andretmarques/debut@1033b462c4570f9a3f342b8bb2913e5c59b5112c # v0.1.1
        with:
          version: ${{ steps.tag.outputs.version }}
          key-id: ${{ secrets.DEBUT_KEY_ID }}
          issuer-id: ${{ secrets.DEBUT_ISSUER_ID }}
          key: ${{ secrets.DEBUT_KEY }}
          certificate: ${{ secrets.DEBUT_CERT_P12 }}
          certificate-password: ${{ secrets.DEBUT_CERT_PASSWORD }}
